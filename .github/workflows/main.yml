name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile & package
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/main/java/ArgoNode.java
          jar --create --file argo-node.jar --main-class ArgoNode -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: argo-node
          path: argo-node.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: argo-node.jar